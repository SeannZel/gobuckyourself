name: Update player values

on:
  schedule:
    - cron: '0 12 * * 2'   # Tuesdays 12:00 UTC — last week's fantasy points are final after Monday night
    - cron: '0 11 * * 3'   # Wednesdays 11:00 UTC (7am ET) — after PIHS publishes Tuesday night
    - cron: '0 15 * * 6'   # Saturdays 15:00 UTC — fresh Vegas lines, injury designations and projections before Sunday
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build values
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
          PIHS_SHEETS: ${{ secrets.PIHS_SHEETS }}
        run: npm run build:values
      - name: Commit if changed
        run: |
          git config user.name "gobuckyourself-bot"
          git config user.email "bot@users.noreply.github.com"
          git add js/players.js data/values.json data/history.json data/scoring.json
          git diff --cached --quiet || git commit -m "chore: refresh player values $(date -u +%Y-%m-%d)"
          git push
